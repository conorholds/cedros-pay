# Standalone workspace for the Cedros Pay server extension backend, compiled to a
# WebAssembly component (wasm32-wasip2) and hot-loaded by a cedros-data host.
#
# The guest links only the host-capability seams in guest/wit/cedros-extension.wit.
#
#   cargo build -p cedros-pay-extension-guest \
#     --target wasm32-wasip2 --release          # the component
#   cargo test                                  # domain + hostsim; requires component
[workspace]
resolver = "2"
members = ["domain", "guest", "hostsim"]
# Host-target commands (`cargo test`, `cargo clippy`) operate on the pure crates;
# the guest is a wasm-only cdylib, built explicitly with `--target wasm32-wasip2`.
default-members = ["domain", "hostsim"]

[workspace.package]
edition = "2021"
version = "5.0.8"
publish = false
license = "LicenseRef-PILL-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size- and determinism-tuned release profile for the component. Compile happens
# off the request path (at install/boot), so we favour a small, fast artifact.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
